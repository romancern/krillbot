[project]
name = "krillion-bot"
version = "0.1.0"
description = "Experimental Puffer Party assistant"
requires-python = ">=3.10"
dependencies = [
    "openai>=2,<4",
    "playwright>=1.50,<2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
krillion = "krillion.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krillion"]
